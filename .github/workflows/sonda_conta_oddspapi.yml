name: Sonda da conta OddsPapi (cota)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ler a cota (nao gasta requisicao)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python sonda_conta_oddspapi.py
