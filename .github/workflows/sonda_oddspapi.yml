# SONDA da OddsPapi (27/10/2026): so manual. Confere a chave e o formato antes do
# robo de verdade. A chave vem do secret ODDS_API_KEY e nunca e impressa.
name: Sonda OddsPapi

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sondar
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python sonda_oddspapi.py
      - name: Commitar o resultado
        run: |
          git config user.name "Robo GabineteCS"
          git config user.email "robo@gabinete.local"
          [ -f sonda_oddspapi.json ] && git add sonda_oddspapi.json
          git diff --cached --quiet && exit 0
          git commit -m "Robô: sonda da OddsPapi"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash || exit 1
          done
          git push
